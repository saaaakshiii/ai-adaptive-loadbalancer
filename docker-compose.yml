services:
  server-a:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    environment:
      SERVER_ID: server-a
      PORT: 8001
    expose: ["8001"]
    cpus: 1.0

  server-b:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    environment:
      SERVER_ID: server-b
      PORT: 8001
    expose: ["8001"]
    cpus: 0.5

  server-c:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    environment:
      SERVER_ID: server-c
      PORT: 8001
    expose: ["8001"]
    cpus: 2.0

  load-balancer:
    build: .
    command: uvicorn load_balancer.main:app --host 0.0.0.0 --port 8000
    environment:
      BACKENDS: "server-a=http://server-a:8001,server-b=http://server-b:8001,server-c=http://server-c:8001"
      Q_TABLE_PATH: /app/data/q_table.json
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
    depends_on:
      - server-a
      - server-b
      - server-c

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      LB_URL: http://load-balancer:8000
    ports: ["8501:8501"]
    depends_on:
      - load-balancer

  locust:
    build: .
    command: locust -f experiments/locustfile.py --host http://load-balancer:8000 --web-host 0.0.0.0
    profiles: ["loadtest"]
    ports: ["8089:8089"]
    depends_on:
      - load-balancer
